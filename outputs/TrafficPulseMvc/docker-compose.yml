name: trafficpulse-mvc
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-trafficpulse}
      MYSQL_USER: ${MYSQL_USER:-trafficapp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports: ["127.0.0.1:3307:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 21
    restart: unless-stopped
  kafka:
    image: apache/kafka:latest
    hostname: kafka
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped
  web:
    build:
      context: .
      args: { PROJECT: TrafficWeb }
    command: ["dotnet", "TrafficWeb.dll"]
    ports: ["127.0.0.1:5187:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      App__DemoMode: "false"
      App__DataPath: /app/.data
      ConnectionStrings__MySql: "Server=mysql;Database=${MYSQL_DATABASE:-trafficpulse};User=${MYSQL_USER:-trafficapp};Password=${MYSQL_PASSWORD};DateTimeKind=Utc"
      Bootstrap__Email: ${BOOTSTRAP_EMAIL:?Set BOOTSTRAP_EMAIL in .env}
      Bootstrap__Password: ${BOOTSTRAP_PASSWORD:?Set BOOTSTRAP_PASSWORD in .env}
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
    volumes: ["web-data:/app/.data"]
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  producer:
    build:
      context: .
      args: { PROJECT: TrafficProducer }
    command: ["dotnet", "TrafficProducer.dll"]
    environment:
      ConnectionStrings__MySql: "Server=mysql;Database=${MYSQL_DATABASE:-trafficpulse};User=${MYSQL_USER:-trafficapp};Password=${MYSQL_PASSWORD};DateTimeKind=Utc"
      Kafka__BootstrapServers: kafka:29092
      Traffic__Provider: ${TRAFFIC_PROVIDER:-TomTom}
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
      Traffic__PollSeconds: ${POLL_SECONDS:-60}
    depends_on:
      kafka: { condition: service_healthy }
      web: { condition: service_healthy }
    restart: unless-stopped
  consumer:
    build:
      context: .
      args: { PROJECT: TrafficConsumer }
    command: ["dotnet", "TrafficConsumer.dll"]
    environment:
      ConnectionStrings__MySql: "Server=mysql;Database=${MYSQL_DATABASE:-trafficpulse};User=${MYSQL_USER:-trafficapp};Password=${MYSQL_PASSWORD};DateTimeKind=Utc"
      Kafka__BootstrapServers: kafka:29092
    depends_on:
      kafka: { condition: service_healthy }
      web: { condition: service_healthy }
    restart: unless-stopped
volumes:
  mysql-data:
  kafka-data:
  web-data:
